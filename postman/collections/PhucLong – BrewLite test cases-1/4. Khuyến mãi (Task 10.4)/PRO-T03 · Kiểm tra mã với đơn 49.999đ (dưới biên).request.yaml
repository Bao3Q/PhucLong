$kind: http-request
name: PRO-T03 · Kiểm tra mã với đơn 49.999đ (dưới biên) → 400
description: |-
  **PRO-T03** – Kiểm tra mã với đơn 49.999đ (dưới biên) → 400

  - **Yêu cầu:** Task 10.4
  - **Kỹ thuật:** Giá trị biên (min − 1)
  - **Kết quả mong đợi:** 400, báo áp dụng cho đơn từ 50.000đ
url: "{{baseUrl}}/promotions/validate"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "WELCOME10",
      "subtotal": 49999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Thông báo lỗi chứa "50.000"', () => {
        const m = pm.response.json().message;
        const s = Array.isArray(m) ? m.join(' | ') : String(m);
        pm.expect(s).to.include("50.000");
      });
    language: text/javascript
order: 3000
