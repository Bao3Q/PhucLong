$kind: http-request
description: |-
  **AUTH-T06** – Đăng nhập đúng → 200 + JWT

  - **Yêu cầu:** FR-04
  - **Kỹ thuật:** Happy path
  - **Kết quả mong đợi:** 200, accessToken dạng JWT, tokenType Bearer
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailA}}",
      "password": "Passw0rd!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('accessToken là JWT, tokenType Bearer', () => {
        pm.expect(b.accessToken.split('.')).to.have.lengthOf(3);
        pm.expect(b.tokenType).to.eql('Bearer');
      });
      pm.test('JWT chứa đúng userId (sub)', () => {
        const payload = JSON.parse(atob(b.accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        pm.expect(payload.sub).to.eql(pm.collectionVariables.get('userIdA'));
      });
      pm.collectionVariables.set('userToken', b.accessToken);
    language: text/javascript
order: 6000
