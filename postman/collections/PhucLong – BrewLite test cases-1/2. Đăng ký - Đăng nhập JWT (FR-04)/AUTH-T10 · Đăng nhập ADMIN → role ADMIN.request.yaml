$kind: http-request
description: |-
  **AUTH-T10** – Đăng nhập ADMIN → role ADMIN

  - **Yêu cầu:** FR-04
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 200, user.role = ADMIN
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('role = ADMIN', () => pm.expect(pm.response.json().user.role).to.eql('ADMIN'));
      pm.collectionVariables.set('adminToken', pm.response.json().accessToken);
    language: text/javascript
order: 10000
