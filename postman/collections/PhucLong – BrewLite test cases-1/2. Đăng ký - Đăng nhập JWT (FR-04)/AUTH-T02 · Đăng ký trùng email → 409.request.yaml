$kind: http-request
description: |-
  **AUTH-T02** – Đăng ký trùng email → 409

  - **Yêu cầu:** FR-04
  - **Kỹ thuật:** Ngoại lệ (trùng dữ liệu)
  - **Tiền điều kiện:** AUTH-T01 đã chạy
  - **Kết quả mong đợi:** 409 Conflict
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailA}}",
      "password": "Passw0rd!"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
