$kind: http-request
name: AUTH-T08 · Đăng nhập email chưa đăng ký → 401 (cùng thông báo)
description: |-
  **AUTH-T08** – Đăng nhập email chưa đăng ký → 401 (cùng thông báo)

  - **Yêu cầu:** FR-04, NFR bảo mật
  - **Kỹ thuật:** Ngoại lệ (không lộ email nào tồn tại)
  - **Kết quả mong đợi:** 401, cùng thông báo với AUTH-T07
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "chua.dang.ky@phuclong.test",
      "password": "Passw0rd!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Thông báo lỗi chứa "Email hoặc mật khẩu không đúng"', () => {
        const m = pm.response.json().message;
        const s = Array.isArray(m) ? m.join(' | ') : String(m);
        pm.expect(s).to.include("Email hoặc mật khẩu không đúng");
      });
    language: text/javascript
order: 8000
