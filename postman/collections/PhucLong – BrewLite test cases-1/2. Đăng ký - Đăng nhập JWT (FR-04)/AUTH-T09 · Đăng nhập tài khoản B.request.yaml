$kind: http-request
description: |-
  **AUTH-T09** – Đăng nhập tài khoản B

  - **Yêu cầu:** FR-04
  - **Kỹ thuật:** Chuẩn bị dữ liệu
  - **Kết quả mong đợi:** 200, lưu token B
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailB}}",
      "password": "Abcd123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('userTokenB', pm.response.json().accessToken);
    language: text/javascript
order: 9000
