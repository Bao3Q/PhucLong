$kind: http-request
name: AUTH-T01 · Đăng ký hợp lệ → 201, không trả mật khẩu
description: |-
  **AUTH-T01** – Đăng ký hợp lệ → 201, không trả mật khẩu

  - **Yêu cầu:** FR-04, NFR bảo mật
  - **Kỹ thuật:** Happy path
  - **Kết quả mong đợi:** 201, có id + email, không có password/passwordHash
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailA}}",
      "password": "Passw0rd!"
    }
scripts:
  - type: beforeRequest
    code: |-
      const t = Date.now();
      pm.collectionVariables.set('emailA', 'qa.a.' + t + '@phuclong.test');
      pm.collectionVariables.set('emailB', 'qa.b.' + t + '@phuclong.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const u = pm.response.json();
      pm.test('Có id, đúng email, role CUSTOMER', () => {
        pm.expect(u.id).to.be.a('string').and.not.empty;
        pm.expect(u.email).to.eql(pm.collectionVariables.get('emailA'));
        pm.expect(u.role).to.eql('CUSTOMER');
      });
      pm.test('Không lộ mật khẩu', () => pm.expect(u).to.not.have.any.keys('password', 'passwordHash'));
      pm.collectionVariables.set('userIdA', u.id);
    language: text/javascript
order: 1000
