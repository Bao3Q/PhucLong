$kind: http-request
description: |-
  **AUTH-T07** – Đăng nhập sai mật khẩu → 401

  - **Yêu cầu:** FR-04
  - **Kỹ thuật:** Ngoại lệ
  - **Kết quả mong đợi:** 401, thông báo chung "Email hoặc mật khẩu không đúng"
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailA}}",
      "password": "SaiMatKhau1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Thông báo lỗi chứa "Email hoặc mật khẩu không đúng"', () => {
        const m = pm.response.json().message;
        const s = Array.isArray(m) ? m.join(' | ') : String(m);
        pm.expect(s).to.include("Email hoặc mật khẩu không đúng");
      });
    language: text/javascript
order: 7000
