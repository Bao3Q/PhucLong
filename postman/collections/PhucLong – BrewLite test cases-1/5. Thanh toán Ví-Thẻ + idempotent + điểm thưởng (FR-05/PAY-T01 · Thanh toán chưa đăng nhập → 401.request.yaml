$kind: http-request
description: |-
  **PAY-T01** – Thanh toán chưa đăng nhập → 401

  - **Yêu cầu:** FR-05
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 401
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "orderId": {{orderId}},
      "method": "card"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
