$kind: http-request
description: |-
  **LOY-T01** – Xem điểm thưởng sau khi thanh toán

  - **Yêu cầu:** Task 10.4
  - **Kỹ thuật:** Happy path
  - **Kết quả mong đợi:** 200, điểm > 0
url: "{{baseUrl}}/payments/loyalty"
method: GET
headers:
  Authorization: Bearer {{userToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Đã được cộng điểm', () => pm.expect(pm.response.json().loyaltyPoints).to.be.above(0));
    language: text/javascript
order: 8000
