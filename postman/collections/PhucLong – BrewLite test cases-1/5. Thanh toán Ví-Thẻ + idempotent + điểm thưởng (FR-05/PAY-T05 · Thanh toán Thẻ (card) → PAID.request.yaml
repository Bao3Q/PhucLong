$kind: http-request
description: |-
  **PAY-T05** – Thanh toán Thẻ (card) → PAID

  - **Yêu cầu:** FR-05, Task 8, US-05
  - **Kỹ thuật:** Happy path
  - **Tiền điều kiện:** Đơn ORD-T08 đang PENDING
  - **Kết quả mong đợi:** 201, đơn chuyển PAID, có transactionId
url: "{{baseUrl}}/payments"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Idempotency-Key: "{{payKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "orderId": {{orderId}},
      "method": "card"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('payKey', 'qa-pay-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const p = pm.response.json();
      pm.test('PAID, đúng đơn, đúng số tiền, có transactionId', () => {
        pm.expect(p.status).to.eql('PAID');
        pm.expect(p.orderId).to.eql(Number(pm.collectionVariables.get('orderId')));
        pm.expect(p.amount).to.eql(Number(pm.collectionVariables.get('orderTotal')));
        pm.expect(p.transactionId).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('paymentId', p.id);
    language: text/javascript
order: 4000
