$kind: http-request
name: PAY-T08 · Thanh toán lại đơn đã PAID bằng key mới → không trừ tiền lần 2
description: |-
  **PAY-T08** – Thanh toán lại đơn đã PAID bằng key mới → không trừ tiền lần 2

  - **Yêu cầu:** Task 10.2
  - **Kỹ thuật:** Ngoại lệ nghiệp vụ
  - **Kết quả mong đợi:** 400, đơn không còn chờ thanh toán
url: "{{baseUrl}}/payments"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Idempotency-Key: qa-again-{{$timestamp}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "orderId": {{orderId}},
      "method": "momo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Thông báo lỗi chứa "không còn chờ thanh toán"', () => {
        const m = pm.response.json().message;
        const s = Array.isArray(m) ? m.join(' | ') : String(m);
        pm.expect(s).to.include("không còn chờ thanh toán");
      });
    language: text/javascript
order: 7000
