$kind: http-request
description: |-
  **API-T01** – Xem menu → danh sách sản phẩm đủ trường

  - **Yêu cầu:** FR-01
  - **Kỹ thuật:** Happy path
  - **Kết quả mong đợi:** 200, mảng không rỗng, mỗi phần tử có id, name, basePrice, ảnh, stock
url: "{{baseUrl}}/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const list = pm.response.json();
      pm.test('Mảng không rỗng', () => pm.expect(list).to.be.an('array').that.is.not.empty);
      pm.test('Mỗi sản phẩm đủ trường, giá là số ≥ 0', () => list.forEach((p) => {
        pm.expect(p).to.include.keys('id', 'name', 'basePrice', 'image', 'stock');
        pm.expect(p.basePrice).to.be.a('number').and.at.least(0);
      }));
    language: text/javascript
order: 1000
