$kind: http-request
name: API-T02 · Lọc menu theo danh mục → chỉ trả đúng danh mục
description: |-
  **API-T02** – Lọc menu theo danh mục → chỉ trả đúng danh mục

  - **Yêu cầu:** FR-01
  - **Kỹ thuật:** Phân vùng tương đương
  - **Kết quả mong đợi:** 200, mọi sản phẩm có category = "Cà Phê"
url: "{{baseUrl}}/products?category=Cà Phê"
method: GET
queryParams:
  category: Cà Phê
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Mọi phần tử đúng danh mục', () => pm.response.json().forEach((p) => pm.expect(p.category).to.eql('Cà Phê')));
    language: text/javascript
order: 2000
