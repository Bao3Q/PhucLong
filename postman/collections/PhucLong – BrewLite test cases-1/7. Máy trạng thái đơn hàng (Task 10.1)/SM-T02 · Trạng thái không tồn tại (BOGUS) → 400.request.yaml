$kind: http-request
description: |-
  **SM-T02** – Trạng thái không tồn tại (BOGUS) → 400

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Phân vùng tương đương (vùng không hợp lệ)
  - **Kết quả mong đợi:** 400
url: "{{baseUrl}}/orders/{{pendingOrderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "BOGUS"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
