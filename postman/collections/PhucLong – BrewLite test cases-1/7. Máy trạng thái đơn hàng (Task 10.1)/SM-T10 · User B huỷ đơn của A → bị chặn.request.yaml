$kind: http-request
description: |-
  **SM-T10** – User B huỷ đơn của A → bị chặn

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 403
url: "{{baseUrl}}/orders/{{cancelOrderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{userTokenB}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "CANCELLED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 10000
