$kind: http-request
description: |-
  **SM-T06** – READY → COMPLETED

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Kiểm thử chuyển trạng thái
  - **Kết quả mong đợi:** 200, status COMPLETED
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "COMPLETED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('status = COMPLETED', () => pm.expect(pm.response.json().status).to.eql('COMPLETED'));
    language: text/javascript
order: 6000
