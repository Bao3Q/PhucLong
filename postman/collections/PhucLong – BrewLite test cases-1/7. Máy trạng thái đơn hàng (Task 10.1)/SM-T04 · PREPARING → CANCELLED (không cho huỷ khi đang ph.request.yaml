$kind: http-request
name: SM-T04 · PREPARING → CANCELLED (không cho huỷ khi đang pha) → 400
description: |-
  **SM-T04** – PREPARING → CANCELLED (không cho huỷ khi đang pha) → 400

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Kiểm thử chuyển trạng thái
  - **Kết quả mong đợi:** 400
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "CANCELLED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
