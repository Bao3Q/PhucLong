$kind: http-request
name: SM-T08 · Khách tự chuyển đơn PENDING → PAID (bỏ qua thanh toán) → 403
description: |-
  **SM-T08** – Khách tự chuyển đơn PENDING → PAID (bỏ qua thanh toán) → 403

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Phân quyền + chuyển trạng thái
  - **Kết quả mong đợi:** 403
url: "{{baseUrl}}/orders/{{pendingOrderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "PAID"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 8000
