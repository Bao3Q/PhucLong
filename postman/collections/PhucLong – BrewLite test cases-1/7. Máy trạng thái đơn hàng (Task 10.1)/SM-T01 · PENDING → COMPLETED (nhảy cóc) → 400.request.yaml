$kind: http-request
description: |-
  **SM-T01** – PENDING → COMPLETED (nhảy cóc) → 400

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Kiểm thử chuyển trạng thái
  - **Kết quả mong đợi:** 400, chặn chuyển trạng thái sai
url: "{{baseUrl}}/orders/{{pendingOrderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "COMPLETED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 1000
