$kind: http-request
name: SM-T09 · Khách tự chuyển đơn sang PREPARING → 403 (chỉ nhân viên)
description: |-
  **SM-T09** – Khách tự chuyển đơn sang PREPARING → 403 (chỉ nhân viên)

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 403
url: "{{baseUrl}}/orders/{{pendingOrderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "PREPARING"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
