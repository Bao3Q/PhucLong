$kind: http-request
description: |-
  **SM-T12** – Huỷ lại đơn đã CANCELLED → bị chặn

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Trạng thái kết thúc
  - **Kết quả mong đợi:** 400
url: "{{baseUrl}}/orders/{{cancelOrderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "CANCELLED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000
