$kind: http-request
description: |-
  **SM-T03** – PAID → PREPARING

  - **Yêu cầu:** Task 10.1 (tiêu chí a)
  - **Kỹ thuật:** Kiểm thử chuyển trạng thái
  - **Kết quả mong đợi:** 200, status PREPARING
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "PREPARING"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('status = PREPARING', () => pm.expect(pm.response.json().status).to.eql('PREPARING'));
    language: text/javascript
order: 3000
