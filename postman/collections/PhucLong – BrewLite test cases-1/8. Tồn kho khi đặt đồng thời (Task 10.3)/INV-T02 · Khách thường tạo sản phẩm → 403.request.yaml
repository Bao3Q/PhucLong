$kind: http-request
description: |-
  **INV-T02** – Khách thường tạo sản phẩm → 403

  - **Yêu cầu:** Phân quyền ADMIN
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 403
url: "{{baseUrl}}/products"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "X",
      "category": "X",
      "basePrice": 1000,
      "image": "https://example.com/x.jpg",
      "stock": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
