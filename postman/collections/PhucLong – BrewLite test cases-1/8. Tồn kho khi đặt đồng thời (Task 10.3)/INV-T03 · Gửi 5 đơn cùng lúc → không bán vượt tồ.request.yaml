$kind: http-request
name: INV-T03 · Gửi 5 đơn cùng lúc → không bán vượt tồn kho
description: |-
  **INV-T03** – Gửi 5 đơn cùng lúc → không bán vượt tồn kho

  - **Yêu cầu:** Task 10.3 (tiêu chí c)
  - **Kỹ thuật:** Kiểm thử đồng thời (5 request song song bằng pm.sendRequest)
  - **Kết quả mong đợi:** Số đơn thành công ≤ 3; đơn bị từ chối trả 4xx (không phải 500); tồn kho cuối = 3 − số đơn thành công, không âm
url: "{{baseUrl}}/products/{{qaProductId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Tồn kho ban đầu = 3', () => pm.expect(pm.response.json().stock).to.eql(3));
      const productId = pm.collectionVariables.get('qaProductId');
      const codes = [];
      for (let i = 0; i < 5; i++) {
        pm.sendRequest({
          url: pm.variables.get('baseUrl').replace(/\/$/, '') + '/orders',
          method: 'POST',
          header: [
            { key: 'Content-Type', value: 'application/json' },
            { key: 'Authorization', value: 'Bearer ' + pm.collectionVariables.get('userToken') },
          ],
          body: { mode: 'raw', raw: JSON.stringify({ items: [{ productId, size: 'S', toppings: [], qty: 1 }] }) },
        }, (err, res) => {
          codes.push(err ? 0 : res.code);
          if (codes.length < 5) return;
          const ok = codes.filter((c) => c === 201).length;
          console.log('Kết quả 5 đơn đồng thời:', codes.join(', '));
          pm.test('Số đơn thành công ≤ 3 (không bán vượt)', () => pm.expect(ok).to.be.within(1, 3));
          pm.test('Đơn bị từ chối trả lỗi 4xx', () => codes.filter((c) => c !== 201).forEach((c) => pm.expect(c).to.be.within(400, 499)));
          pm.sendRequest(pm.variables.get('baseUrl').replace(/\/$/, '') + '/products/' + productId, (e, p) => {
            pm.test('Tồn kho cuối = 3 − số đơn thành công', () => pm.expect(p.json().stock).to.eql(3 - ok));
          });
        });
      }
    language: text/javascript
order: 3000
