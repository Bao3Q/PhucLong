$kind: http-request
description: |-
  **HIS-T04** – User B xem chi tiết đơn của A → bị chặn

  - **Yêu cầu:** FR-06, NFR bảo mật
  - **Kỹ thuật:** Phân quyền (truy cập dữ liệu người khác)
  - **Kết quả mong đợi:** 403
url: "{{baseUrl}}/orders/{{orderId}}"
method: GET
headers:
  Authorization: Bearer {{userTokenB}}
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
