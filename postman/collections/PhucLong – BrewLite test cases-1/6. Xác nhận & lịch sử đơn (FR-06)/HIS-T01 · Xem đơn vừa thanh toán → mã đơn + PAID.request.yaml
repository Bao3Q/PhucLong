$kind: http-request
description: |-
  **HIS-T01** – Xem đơn vừa thanh toán → mã đơn + PAID

  - **Yêu cầu:** FR-06, Task 9
  - **Kỹ thuật:** Happy path
  - **Kết quả mong đợi:** 200, code = #id, status PAID
url: "{{baseUrl}}/orders/{{orderId}}"
method: GET
headers:
  Authorization: Bearer {{userToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const o = pm.response.json();
      pm.test('Có mã đơn, status PAID', () => {
        pm.expect(o.code).to.eql('#' + pm.collectionVariables.get('orderId'));
        pm.expect(o.status).to.eql('PAID');
      });
    language: text/javascript
order: 1000
