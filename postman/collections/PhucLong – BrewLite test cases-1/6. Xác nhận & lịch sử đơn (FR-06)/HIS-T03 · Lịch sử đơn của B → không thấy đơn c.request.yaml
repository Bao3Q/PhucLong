$kind: http-request
name: HIS-T03 · Lịch sử đơn của B → không thấy đơn của A
description: |-
  **HIS-T03** – Lịch sử đơn của B → không thấy đơn của A

  - **Yêu cầu:** FR-06, NFR bảo mật
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 200, không chứa đơn của A
url: "{{baseUrl}}/orders/me"
method: GET
headers:
  Authorization: Bearer {{userTokenB}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Không chứa đơn của A', () => pm.expect(pm.response.json().map((o) => o.id)).to.not.include(Number(pm.collectionVariables.get('orderId'))));
    language: text/javascript
order: 3000
