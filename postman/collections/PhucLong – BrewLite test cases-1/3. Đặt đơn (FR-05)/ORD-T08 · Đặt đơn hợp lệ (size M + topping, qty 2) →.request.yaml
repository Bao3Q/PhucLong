$kind: http-request
name: ORD-T08 · Đặt đơn hợp lệ (size M + topping, qty 2) → PENDING, server tự tính giá
description: |-
  **ORD-T08** – Đặt đơn hợp lệ (size M + topping, qty 2) → PENDING, server tự tính giá

  - **Yêu cầu:** FR-05, Task 6
  - **Kỹ thuật:** Happy path + chống sửa giá từ client
  - **Tiền điều kiện:** Đã đăng nhập (AUTH-T06)
  - **Kết quả mong đợi:** 201, status PENDING, mã đơn #id, unitPrice = giá gốc + 5k (M) + giá topping, bỏ qua unitPrice = 1 do client gửi
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        { "productId": "1", "size": "M", "qty": 2, "toppings": ["{{toppingName}}"], "unitPrice": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const o = pm.response.json();
      const unit = Number(pm.collectionVariables.get('price1')) + 5000 + Number(pm.collectionVariables.get('toppingPrice'));
      pm.test('PENDING, có mã đơn', () => {
        pm.expect(o.status).to.eql('PENDING');
        pm.expect(o.code).to.eql('#' + o.id);
      });
      pm.test('Giá do server tính, không dùng giá client gửi', () => {
        pm.expect(o.items[0].unitPrice).to.eql(unit);
        pm.expect(o.items[0].lineTotal).to.eql(unit * 2);
        pm.expect(o.total).to.eql(unit * 2);
      });
      pm.collectionVariables.set('orderId', o.id);
      pm.collectionVariables.set('orderTotal', o.total);
    language: text/javascript
order: 8000
