$kind: http-request
description: |-
  **ORD-T03** – Giỏ hàng trống → 400

  - **Yêu cầu:** FR-05
  - **Kỹ thuật:** Giá trị biên (0 sản phẩm)
  - **Kết quả mong đợi:** 400, "Giỏ hàng không được để trống"
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Thông báo lỗi chứa "Giỏ hàng không được để trống"', () => {
        const m = pm.response.json().message;
        const s = Array.isArray(m) ? m.join(' | ') : String(m);
        pm.expect(s).to.include("Giỏ hàng không được để trống");
      });
    language: text/javascript
order: 3000
