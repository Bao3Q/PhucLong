$kind: http-request
description: |-
  **ORD-T07** – Sản phẩm không tồn tại → 404

  - **Yêu cầu:** FR-05
  - **Kỹ thuật:** Ngoại lệ
  - **Kết quả mong đợi:** 404
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "khong-ton-tai",
          "size": "M",
          "toppings": [],
          "qty": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000
