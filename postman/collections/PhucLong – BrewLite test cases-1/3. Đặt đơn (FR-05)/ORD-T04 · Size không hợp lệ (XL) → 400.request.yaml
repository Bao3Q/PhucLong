$kind: http-request
description: |-
  **ORD-T04** – Size không hợp lệ (XL) → 400

  - **Yêu cầu:** FR-02, FR-05
  - **Kỹ thuật:** Phân vùng tương đương (vùng không hợp lệ)
  - **Kết quả mong đợi:** 400
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "1",
          "size": "XL",
          "toppings": [],
          "qty": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
