$kind: http-request
description: |-
  **ORD-T02** – Đặt đơn với token giả → 401

  - **Yêu cầu:** FR-05, NFR bảo mật
  - **Kỹ thuật:** Phân quyền
  - **Kết quả mong đợi:** 401 Unauthorized
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: "{{bearer_token_14lb}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "1",
          "size": "M",
          "toppings": [],
          "qty": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
