name: BrewLite CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  web-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  api-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Postgres thật cho bước migration + integration test (không còn chỉ
    # test in-memory — transaction SQL thật được kiểm tra trong CI).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phuclong
          POSTGRES_PASSWORD: phuclong_password
          POSTGRES_DB: phuclong_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phuclong -d phuclong_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://phuclong:phuclong_password@localhost:5432/phuclong_ci?schema=public
      JWT_SECRET: ci_test_secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit + Integration Test
        run: npm run test

      - name: Build
        run: npm run build
