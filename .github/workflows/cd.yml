name: BrewLite CD Pipeline

# Push/Tag → Lint & Test → Build → Docker Image → Push Registry → Deploy → Smoke Test
#
# - Push lên main  : deploy production với image tag = commit SHA.
# - Push tag v*.*.*: như trên + tag semantic version + tạo GitHub Release từ
#                    docs/release-notes/<tag>.md.
# - Chạy tay       : Actions → BrewLite CD Pipeline → Run workflow.
#
# Secrets cần tạo trong Settings → Secrets and variables → Actions (xem docs/deployment.md):
#   RENDER_DEPLOY_HOOK_URL  Deploy Hook của service API trên Render (bắt buộc để deploy)
#   RENDER_API_KEY          API key Render (để rollback tự động)
#   RENDER_SERVICE_ID       Id service API trên Render, dạng srv-xxxx (để rollback tự động)
#   PROD_DATABASE_URL       Chuỗi kết nối Neon (để chạy migration trước khi deploy)
# Variables (không bí mật):
#   PROD_API_URL            https://phuclong-kf14.onrender.com
#   PROD_WEB_URL            https://phuc-long-omega.vercel.app
#   RENDER_IMAGE_DEPLOY     "true" nếu service Render chạy từ image GHCR (Existing Image)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/phuclong-api
  PROD_API_URL: ${{ vars.PROD_API_URL || 'https://phuclong-kf14.onrender.com' }}
  PROD_WEB_URL: ${{ vars.PROD_WEB_URL || 'https://phuc-long-omega.vercel.app' }}

jobs:
  # 1. Quality gate: lint + unit/integration/E2E test + build (tái dùng ci.yml)
  quality-gate:
    name: Quality gate (CI)
    uses: ./.github/workflows/ci.yml

  # 2–3. Build Docker image API, tag bằng commit SHA (+ semver khi push tag), push GHCR
  image:
    name: Build & push Docker image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tính tag image
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/phuclong-api" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tag sha-xxxxxxx, vX.Y.Z, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4–7. Migration an toàn → deploy bằng secret → smoke test → rollback nếu lỗi
  deploy:
    name: Deploy production + smoke test
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_WEB_URL || 'https://phuc-long-omega.vercel.app' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kiểm tra secret bắt buộc
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Thiếu secret RENDER_DEPLOY_HOOK_URL (xem docs/deployment.md)"; exit 1
          fi

      # Migration forward-only (prisma migrate deploy) chạy TRƯỚC khi đổi code:
      # lỗi migration → dừng pipeline, bản đang chạy không bị ảnh hưởng.
      # (Dockerfile.api cũng chạy migrate deploy khi khởi động – lệnh idempotent.)
      - name: Chạy migration production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Không có PROD_DATABASE_URL – migration sẽ chạy lúc container khởi động."
            exit 0
          fi
          npm install --no-audit --no-fund
          cd apps/api && npx prisma migrate deploy

      - name: Deploy API lên Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ env.IMAGE_NAME }}
          SHA_TAG: ${{ needs.image.outputs.sha_tag }}
          IMAGE_DEPLOY: ${{ vars.RENDER_IMAGE_DEPLOY }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "$IMAGE_DEPLOY" = "true" ]; then
            # Service chạy từ image: deploy đúng image vừa build (tag commit SHA)
            curl -fsS -X POST --get "$HOOK" --data-urlencode "imgURL=${IMAGE}:${SHA_TAG}" > /dev/null
            echo "Đã yêu cầu Render deploy ${IMAGE}:${SHA_TAG}"
          else
            # Service build từ repo: hook build lại commit mới nhất của nhánh đã cấu hình
            curl -fsS -X POST "$HOOK" > /dev/null
            echo "Đã yêu cầu Render deploy commit ${GITHUB_SHA::7}"
          fi

      - name: Smoke test (health, menu, CORS, web)
        id: smoke
        run: |
          # Render cần vài phút để build/khởi động: chờ tối đa ~10 phút
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "$PROD_API_URL/health" | grep -q '"database":"up"'; then ok=1; break; fi
            echo "Chờ API sẵn sàng ($i/60)…"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::/health không trả database up"; exit 1; }

          curl -fsS "$PROD_API_URL/products" | grep -q '"id"' \
            || { echo "::error::GET /products lỗi"; exit 1; }

          # Web trên Vercel phải gọi được API: header CORS phải chứa domain web
          curl -fsS -D - -o /dev/null -H "Origin: $PROD_WEB_URL" "$PROD_API_URL/products" \
            | grep -qi "access-control-allow-origin: $PROD_WEB_URL" \
            || { echo "::error::Thiếu CORS cho $PROD_WEB_URL – kiểm tra biến CORS_ORIGIN trên Render"; exit 1; }

          curl -fsS -o /dev/null "$PROD_WEB_URL" \
            || { echo "::error::Web production không truy cập được"; exit 1; }
          echo "Smoke test OK"

      - name: Đánh dấu image ổn định (stable)
        if: success()
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          SHA_TAG: ${{ needs.image.outputs.sha_tag }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "${IMAGE}:stable" "${IMAGE}:${SHA_TAG}"

      # Deploy hoặc smoke test lỗi → quay về bản ổn định trước đó rồi DỪNG pipeline (job vẫn đỏ).
      - name: Rollback khi triển khai thất bại
        if: failure()
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE: ${{ env.IMAGE_NAME }}
          IMAGE_DEPLOY: ${{ vars.RENDER_IMAGE_DEPLOY }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "$IMAGE_DEPLOY" = "true" ] && [ -n "$HOOK" ]; then
            echo "Rollback: deploy lại ${IMAGE}:stable"
            curl -fsS -X POST --get "$HOOK" --data-urlencode "imgURL=${IMAGE}:stable" > /dev/null
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            # Bản deploy thành công gần nhất trước bản hiện tại có trạng thái "deactivated"
            PREV=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s).map(x=>x.deploy||x);const d=l.find(x=>x.status==="deactivated");process.stdout.write(d?d.id:"")})')
            if [ -n "$PREV" ]; then
              echo "Rollback Render về deploy $PREV"
              curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
                -d "{\"deployId\":\"$PREV\"}" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback" > /dev/null
            else
              echo "::warning::Không tìm thấy bản deploy trước để rollback – làm tay theo README mục 7."
            fi
          else
            echo "::warning::Chưa cấu hình RENDER_API_KEY/RENDER_SERVICE_ID – rollback tay theo README mục 7 (Render → Deploys → Rollback)."
          fi
          echo "::error::Triển khai thất bại – pipeline dừng."

  # Tạo GitHub Release khi push tag vX.Y.Z (release notes lấy từ docs/release-notes)
  release:
    name: GitHub Release
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tạo release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "BrewLite Phúc Long $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "BrewLite Phúc Long $TAG" --generate-notes
          fi
