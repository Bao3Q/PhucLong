name: Keep Render Alive

# Render free tier spin down sau ~15 phút không có traffic -> ping định kỳ để giữ API "thức".
# Lưu ý của GitHub Actions:
# - Cron ngắn nhất là 5 phút, và scheduled run thường bị trễ 5-20 phút khi queue đông.
#   Vì vậy nên đặt */5 thay vì */10 để chắc chắn có ít nhất 1 request trong mỗi 15 phút.
# - Scheduled workflow tự tắt sau 60 ngày repo không có commit/PR nào.
# - Fork của repo thì scheduled workflow mặc định bị disable.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        env:
          API_URL: ${{ vars.PROD_API_URL || 'https://phuclong-kf14.onrender.com' }}
        run: |
          # Cold start trên Render free có thể mất 30-60s -> cho curl tối đa 90s và thử lại 2 lần.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            "$API_URL/health") || true
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          [ "$code" = "200" ] || { echo "::error::/health trả $code - kiểm tra service Render"; exit 1; }
